name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies (exclude OCR/PyTorch)
        run: uv sync --locked --extra dev

      - name: Run Ruff code linting
        run: uv run ruff check

      - name: Run pytest test suite
        run: uv run pytest tests

  frontend-ci:
    name: Frontend & Extension CI (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests (Vitest)
        run: npm test

      - name: Build frontend production web app
        run: npm run build

      - name: Build browser extension bundle
        run: npm run build:extension

      - name: Verify extension bundle integrity
        run: |
          test -s ../extension/content.js
          git diff --exit-code ../extension/content.js || {
            echo "::error::extension/content.js 与 extension/src/ 源码不一致！请在 frontend/ 目录下执行 'npm run build:extension' 并提交编译产物。"
            exit 1
          }
          echo "Extension content.js verified successfully."
